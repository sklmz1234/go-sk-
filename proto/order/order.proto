syntax = "proto3";

package order;

option go_package = "go-ecom-admin/proto/order;orderpb";


service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersResponse);

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  rpc PayOrder(PayOrderRequest) returns (PayOrderResponse);
}

// 订单状态机：MVP 里创建即 PENDING；Cancel 只允许 PENDING → CANCELLED 单方向流转。
// PAID 预留给支付环节（超出本阶段范围）。
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_CANCELLED = 3;
}

// OrderItem 的两个电商基本功：
//   - unit_price_cents 是下单时刻的价格快照——商品价格会改，订单金额不能跟着变；
//   - product_name 同样是快照，商品改名/下架后历史订单仍然可读。
message OrderItem {
  uint64 product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
}

message Order {
  uint64 id = 1;
  uint64 user_id = 2;
  OrderStatus status = 3;
  int64 total_cents = 4;
  repeated OrderItem items = 5;
  int64 created_at = 6;
}

message CreateOrderItem {
  uint64 product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  repeated CreateOrderItem items = 1;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  uint64 id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListMyOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMyOrdersResponse {
  repeated Order orders = 1;
  int64 total = 2;
}

message CancelOrderRequest {
  uint64 id = 1;
}

message CancelOrderResponse {
  Order order = 1;
}

message PayOrderRequest {
  uint64 id = 1;
}

message PayOrderResponse {
  Order order = 1;
}
