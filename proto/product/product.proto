syntax = "proto3";

package product;

option go_package = "go-ecom-admin/proto/product;productpb";

// ProductService 是 product-service 对外暴露的 gRPC 契约，供 api-gateway 调用。
service ProductService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  // 阶段 3：库存扣减/回补，供 order-service 下单编排调用。
  // 这两个方法是系统内部调用——只要求 metadata 带身份（审计用），不做归属校验，
  // 和 Update/Delete 的"只能操作自己的商品"是两种语义（身份用于追责，归属用于授权）。
  rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
  rpc RestoreStock(RestoreStockRequest) returns (RestoreStockResponse);
}

message GetProductRequest {
  uint64 id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CreateProductRequest {
  string name = 1;
  int64 price_cents = 2; // 价格用最小货币单位（分）存储和传输，避免浮点数误差
  int32 stock = 3;
  // 阶段 5A：C 端商城需要图文展示，创建入口（管理台/seed）必须能写入，
  // 否则新商品永远没有图和描述。可选字段，空串=无图无描述。
  string description = 4;
  string image_url = 5;
}

message CreateProductResponse {
  Product product = 1;
}

// UpdateProductRequest 是整体替换语义（PUT），不是 PATCH 式的局部更新——
// 阶段 2 的商品字段少，局部更新（哪些字段传了才更新）带来的复杂度不值得，
// 客户端每次都传完整字段更简单、更不容易出现"忘记传导致字段被静默清空"的问题。
message UpdateProductRequest {
  uint64 id = 1;
  string name = 2;
  int64 price_cents = 3;
  int32 stock = 4;
  // 同 CreateProductRequest：整体替换语义下这两个字段也必须传全，
  // 不传会被空串覆盖（这正是 proto 注释里"整体替换"的含义）。
  string description = 5;
  string image_url = 6;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  uint64 id = 1;
}

// 空响应：删除成功与否用 gRPC status 表达（NotFound / OK），不需要在 body 里再放一个 success 字段。
message DeleteProductResponse {}

message ListProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
  // 阶段 5A：搜索关键词。空串=普通分页列表（走 MySQL offset/limit）；
  // 非空=搜索（走 Elasticsearch 召回 + MySQL 回表，实现细节对调用方透明）。
  string keyword = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  int64 total = 2;
}

// DeductStock 防超卖的核心契约：服务端用一条条件更新 SQL 原子完成
// （UPDATE products SET stock = stock - ? WHERE id = ? AND stock >= ?），
// RowsAffected == 0 即库存不足，返回 FailedPrecondition——数据库是唯一真相源，
// 不存在"先查后改"的 TOCTOU 窗口。
message DeductStockRequest {
  uint64 product_id = 1;
  int32 quantity = 2;
}

// DeductStockResponse 除了扣减后的剩余库存，还带回扣减时刻的 price_cents / name
// 快照：下单方（order-service）需要把"下单时的价格"写进 OrderItem.unit_price_cents
// ——商品价格以后会改，订单金额不能跟着变。一次调用拿全，避免"先 GetProduct 再
// DeductStock"的两次往返和更大的价格竞态窗口。
// （严格说 UPDATE 扣减后再读价格仍有理论竞态：扣减成功与读取之间商品被改价，
// 快照会是新价。学习项目量级无感；真要原子快照需要 SELECT ... FOR UPDATE
// 或把价格写进库存行同事务读取，面试可展开这层权衡。）
message DeductStockResponse {
  int32 remaining_stock = 1;
  int64 price_cents = 2;
  string name = 3;
}

// RestoreStock 是 DeductStock 的补偿操作（Saga 回滚），无条件加回库存。
//
// 阶段 4（本地消息表）后它有两种调用形态，由 message_id 区分：
//   - message_id 为空：非消息驱动的直接调用（如 CreateOrder 失败时的同步补偿），
//     维持 3B 老语义——幂等不安全，重复调用会重复加，调用方自己保证
//     "一次成功的 Deduct 最多对应一次 Restore"。
//   - message_id 非空：outbox relay 驱动的投递。服务端用 message_id 做去重键
//     （stock_restores 表），同一 message_id 重复投递只加一次库存——
//     这是把 relay 的"至少一次投递"收敛成"恰好一次生效"的幂等另一半。
//
// 身份约定：消息驱动的调用由 order-service 内部的 relay goroutine 发起，
// 没有真实用户身份，按系统身份约定注入 user_id=0（pkg/identity 的
// InjectOutgoingSystem / FromIncomingAllowSystem）——0 不是任何真实用户，
// 审计日志里 caller_id=0 即"系统内部回补"。
message RestoreStockRequest {
  uint64 product_id = 1;
  int32 quantity = 2;
  // 幂等键（UUID），由 order 侧 outbox 在写消息时生成。proto3 加字段
  // 向后兼容：老调用方不传即为空，走老语义。见上方方法级注释。
  string message_id = 3;
}

message RestoreStockResponse {
  int32 remaining_stock = 1;
}

message Product {
  uint64 id = 1;
  string name = 2;
  int64 price_cents = 3;
  int32 stock = 4;
  int64 created_at = 5;
  // owner_id 是创建者的用户 ID，由 product-service 从 gRPC metadata 的
  // user_id 写入——客户端传不了也改不了它。归属校验（Update/Delete 只能
  // 操作自己的商品）依据就是这个字段，所以它必须出现在响应里，前端
  // 才能知道"这个商品是不是我的、要不要显示编辑按钮"。
  uint64 owner_id = 6;
  // 阶段 5A：C 端商城展示字段。image_url 是外链（picsum 等占位图服务），
  // 不做本地图片托管——学习项目零基建起步，对象存储留待后期。
  string description = 7;
  string image_url = 8;
}

// —— 阶段 5B：购物车 ——
//
// CartService 独立成 service 而不是塞进 ProductService：购物车虽然和商品
// 同库（ListCart 要 JOIN products 拿实时信息），但它不是商品 CRUD 的延伸。
// ProductService 背后的 Repository 接口被缓存/搜索两层装饰器包裹，把
// 购物车方法加进去会让那份接口无谓膨胀——购物车不需要缓存（低频读写、
// 数据强个人化没有共享收益）也不需要搜索。
//
// user_id 一律来自 gRPC metadata（pkg/identity），不进 message——与
// ProductService 写路径同一约定：身份是横切关注点。
service CartService {
  // AddItem 增量加购：同商品重复加购数量累加（联合唯一键 + 原子 upsert），
  // 不插新行。不校验库存——库存校验放在下单（409 兜底），避免"加购时有货、
  // 结算时售罄"的双重校验语义打架。
  rpc AddItem(AddCartItemRequest) returns (CartResponse);
  rpc ListCart(ListCartRequest) returns (CartResponse);
  // UpdateItemQuantity 绝对值语义：设置该商品数量为 quantity（不是增量）。
  rpc UpdateItemQuantity(UpdateCartItemRequest) returns (CartResponse);
  // RemoveItems 批量删除，幂等——结算清车传勾选的 product_ids，重复调用
  // 或删除不存在的条目都不报错（RowsAffected 对 DELETE 没有业务含义）。
  rpc RemoveItems(RemoveCartItemsRequest) returns (CartResponse);
}

message AddCartItemRequest {
  uint64 product_id = 1;
  int32 quantity = 2; // 增量：本次加购数量，1~99
}

message ListCartRequest {}

message UpdateCartItemRequest {
  uint64 product_id = 1;
  int32 quantity = 2; // 绝对值：设置后的数量，1~99
}

message RemoveCartItemsRequest {
  repeated uint64 product_ids = 1; // 批量删除（结算清车传勾选项），幂等
}

// CartItem 的展示信息（name/price/image/stock）是 JOIN products 的实时值，
// 购物车表里不存快照——价格快照的正确位置是订单（OrderItem.unit_price_cents，
// 下单时刻由 DeductStock 给出），车里存快照反而制造"显示 99 成交 199"
// 之外的第二份要维护一致性的价格数据。
message CartItem {
  uint64 product_id = 1;
  int32 quantity = 2;
  string name = 3;
  int64 price_cents = 4;
  string image_url = 5;
  int32 stock = 6;
}

message CartResponse {
  repeated CartItem items = 1;
  // total_quantity 是全部条目 quantity 之和——顶栏购物车角标的数字来源，
  // 服务端算一次，免得各端自己遍历再各自漂移。
  int32 total_quantity = 2;
}
