syntax = "proto3";

// package 与 go_package 分开声明：package 是 proto 命名空间（跨语言通用），
// go_package 只影响生成的 Go 代码放在哪个 import path / 用什么包名。
package user;

option go_package = "go-ecom-admin/proto/user;userpb";

// UserService 是 user-service 对外暴露的 gRPC 契约。
// api-gateway 通过这份契约生成的客户端桩代码调用 user-service，
// 两边永远不会引用对方的 internal 包，proto 就是唯一的耦合点。
//
// 阶段 2 起，「创建用户」只有 Register 一条路径（不再有阶段 1 那个不需要
// 密码的 CreateUser）——一个项目里如果同时存在「无密码建号」和「带密码注册」
// 两条语义重复的入口，会让调用方不知道该用哪个，也给绕过认证留了后门。
service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // GetRandomAddress（阶段 5B）：随机返回一条收货信息。C 端结算/支付页
  // 展示"收货人 / 电话 / 地址"用——学习项目没有真实地址簿，addresses 表
  // 是 seed 灌的 mock 数据池，每次随机取一条，让下单流程有完整的视觉
  // 闭环。以后升级成真实地址簿（按 user_id 归属 + CRUD）时换接口即可，
  // 前端只改数据源。空池返回 NotFound。
  rpc GetRandomAddress(GetRandomAddressRequest) returns (GetRandomAddressResponse);
}

message GetUserRequest {
  uint64 id = 1;
}

message GetUserResponse {
  User user = 1;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3; // 明文密码只在这一跳传输（gRPC 走内网，且生产环境应加 TLS），落库前 user-service 立刻做 bcrypt 哈希
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1; // JWT，由 user-service 签发；api-gateway 只负责校验，不签发
  User user = 2;
}

// User 是 gRPC 传输用的消息类型，故意不直接复用 internal/user/model.User。
// 数据库模型可以自由改字段（加索引、加内部字段）而不用担心破坏对外契约。
//
// 注意：这里永远不会出现 password / password_hash 字段。哈希后的密码只存在于
// internal/user/model.User（数据库模型）里，toProto() 转换函数根本不去读它，
// 这样"密码不出现在网络传输里"是分层结构本身保证的，不是靠额外的过滤逻辑。
message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  int64 created_at = 4; // unix 秒，proto3 没有原生时间类型，用整数最简单也最少歧义
}

// —— 阶段 5B：收货地址（mock 数据池） ——

message GetRandomAddressRequest {}

message GetRandomAddressResponse {
  Address address = 1;
}

message Address {
  uint64 id = 1;
  string receiver_name = 2;
  string phone = 3;
  // 完整地址（省市区 + 详细地址拼好的单字符串）：展示层只需要"一条能读
  // 的地址"，拆字段是未来真实地址簿（要支持省市区级联选择）才值得付的复杂度。
  string address = 4;
}
