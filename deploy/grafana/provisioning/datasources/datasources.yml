# Grafana 数据源 provisioning：容器起来就自动配好，免手动点 UI。
# 两个数据源对应三支柱里的两根：Prometheus（指标）+ Jaeger（追踪）。

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - datasourceUid: jaeger
          name: trace_id

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
