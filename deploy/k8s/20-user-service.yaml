# user-service：Deployment(2 副本) + Service。
# 这份文件是三个服务里的"讲解范本"，product/gateway 与它结构对称。
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecom
spec:
  selector:
    app: user-service # 靠 label 把 Service 和 Pod 关联起来（不是靠名字！）
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecom
  labels:
    app: user-service
spec:
  replicas: 2 # 两个副本分散在不同 Node 上——Service 自动做负载均衡
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service # 必须和上面 matchLabels 一致
    spec:
      containers:
        - name: user-service
          image: go-ecom-admin/user-service:TAG
          # :TAG 是占位符
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: db-credentials } # 只给 DB 业务账号，root 密码不进这个 Pod
            - secretRef: { name: jwt-secret }     # user 是 JWT 签发方
          ports:
            - name: grpc
              containerPort: 9001
          # K8s 原生 grpc 探针（1.24+）：调 grpc.health.v1 的 Check，
          # 即 main.go 里注册的标准健康检查服务。端口通≠服务可用，
          # 这才是有业务含义的探活。
          readinessProbe: # 未就绪就从 Service 摘除，不接流量但不重启
            grpc:
              port: 9001
            periodSeconds: 5
          livenessProbe: # 真死了才重启 Pod
            grpc:
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 20
          # 优雅退出（配合 main.go 的 SIGTERM 处理）

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      # Pod 级字段：preStop + 宽限期共同构成优雅退出
      terminationGracePeriodSeconds: 30
