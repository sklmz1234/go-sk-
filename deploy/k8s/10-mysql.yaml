# MySQL：StatefulSet + PVC。

apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ecom
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ecom
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          # 和 compose 阶段保持一致：容器时区 + MySQL 时区都要设，
          # 否则时间戳差 8 小时（GORM DSN 的 loc=Local 依赖容器 TZ）。
          args: ["--default-time-zone=+08:00"]
          env:
            - name: TZ
              value: Asia/Shanghai
            # 下面四个 = mysql 镜像首次初始化行为：建库、建业务账号。
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-root, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: { name: app-config, key: MYSQL_DB_NAME }
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: MYSQL_PASSWORD }
          ports:
            - name: mysql
              containerPort: 3306

          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -h127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1' --silent"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30 # 首次初始化可能较慢
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
